<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Espacial Bellinha</title>
    <meta name="description" content="Uma jornada especial para explorar o universo da programação com a Bellinha.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars-container">
        <div id="stars"></div>
        <div id="stars2"></div>
        <div id="stars3"></div>
    </div>

    <main class="content-wrapper">
        <div class="hero-section">
            <div class="planet-container">
                <img src="space_planet_illustration.png" alt="Planeta Místico" id="hero-planet" class="floating">
            </div>
            
            <div class="message-card" id="main-card">
                <h1 class="greeting">Olá, Bellinha!</h1>
                <p class="mission-text">
                    Hoje vamos descobrir do que a programação é capaz e explorar os planetas!
                </p>
                <div class="glow-effect"></div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>Iniciando sequência de lançamento...</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
